static_resources:
  listeners:
  - name: postgres_listener
    address:
      socket_address:
        address: 127.0.0.1
        port_value: 15432
    filter_chains:
    - filters:
      - name: envoy.filters.network.postgres_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.postgres_proxy.v3alpha.PostgresProxy
          stat_prefix: postgres
          enable_sql_parsing: false
          rules:
            action: ALLOW
            policies:
              allow_postgres:
                principals:
                - any: true
                permissions:
                - and_rules:
                    rules:
                    - sourced_metadata:
                        metadata_matcher:
                          filter: envoy.filters.network.postgres_proxy
                          path:
                          - key: startup
                          - key: user
                          value:
                            string_match:
                              exact: postgres
                    - sourced_metadata:
                        metadata_matcher:
                          filter: envoy.filters.network.postgres_proxy
                          path:
                          - key: startup
                          - key: database
                          value:
                            string_match:
                              exact: postgres
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: postgres_upstream
          cluster: postgres
          upstream_connect_mode: ON_DOWNSTREAM_DATA
          max_early_data_bytes: 16384

  clusters:
  - name: postgres
    type: STATIC
    connect_timeout: 2s
    load_assignment:
      cluster_name: postgres
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 5432

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901